<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div>
        <h1>Race Panel <span class="badge">v0.0.2</span> — Schüler</h1>
        <div class="sub">Entra con tu ID. 1 envío por ronda.</div>
      </div>
      <div class="sub" id="wsInfo">WS: —</div>
    </div>

    <div class="card" id="loginCard">
      <div class="row">
        <div>
          <label>Student ID</label>
          <input id="studentId" placeholder="Ej: 65" />
        </div>
        <div style="flex: 1 1 140px;">
          <label>&nbsp;</label>
          <button id="btnLogin" class="btn-accent">Entrar</button>
        </div>
      </div>
      <div class="small" id="loginStatus">No autenticado.</div>
    </div>

    <div class="card" id="roundCard" style="display:none;">
      <div class="kpi">
        <div>Ronda: <span class="badge" id="roundId">—</span></div>
        <div>Estado: <span class="badge" id="roundStatus">—</span></div>
      </div>

      <hr />

      <div id="inputsArea" class="note">Esperando ronda…</div>

      <div class="btnbar">
        <button id="btnSubmit" class="btn-ok" disabled>Enviar</button>
      </div>

      <div class="small" id="submitStatus"></div>
    </div>
  </div>

  <script src="/student.js"></script>
</body>
</html>
