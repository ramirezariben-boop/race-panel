<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Actions Panel — Teacher</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div>
        <h1>Actions Panel <span class="badge">teacher</span></h1>
        <div class="sub">Panel de acciones para alumnos. Fondo negro, texto claro.</div>
      </div>
      <div class="sub" id="wsInfo">WS: —</div>
    </div>

    <div class="card">
      <div class="row">
        <div>
          <label>Teacher Key</label>
          <input id="teacherKey" placeholder="ARIIBEN-TEACHER-2026" />
        </div>
        <div style="flex: 1 1 140px;">
          <label>&nbsp;</label>
          <button id="btnAuth" class="btn-accent">Entrar</button>
        </div>
      </div>
      <div class="small" id="authStatus">No autenticado.</div>
    </div>

    <div class="card">
      <div class="row">
        <div>
          <label>PIN de clase</label>
          <input id="classPin" placeholder="SAM-123" />
        </div>
        <div style="flex: 1 1 140px;">
          <label>&nbsp;</label>
          <button id="btnSetPin">Guardar PIN</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">Configuración de acciones</h3>

      <div class="row">
        <div style="flex:1 1 180px;">
          <label>Panel ID</label>
          <input id="panelId" placeholder="AUTO" />
        </div>

        <div style="flex:1 1 180px;">
          <label>Idioma de clase</label>
          <select id="classLanguage">
            <option value="de" selected>🇩🇪 Deutsch</option>
            <option value="en">🇬🇧 English</option>
            <option value="it">🇮🇹 Italiano</option>
            <option value="pt">🇧🇷 Português</option>
          </select>
        </div>

        <div style="flex:2 1 260px;">
          <label>Nivel de corrección</label>
          <input id="correctionLevel" type="range" min="0" max="100" step="10" value="70" />
          <div class="small"><span id="correctionValue">70%</span></div>
        </div>
      </div>

      <hr />

      <div id="buttonsEditor"></div>

      <div class="btnbar">
        <button id="btnAddAction">+ Añadir acción</button>
      </div>

      <hr />

      <div class="btnbar">
        <button id="btnSave" class="btn-accent">Guardar panel</button>
        <button id="btnOpen" class="btn-warn">Abrir ronda</button>
        <button id="btnClose" class="btn-warn">Cerrar ronda</button>
        <button id="btnExportActions">JSON Acciones</button>
        <button id="btnEndSession" class="btn-warn">Finalizar sesión</button>
      </div>
    </div>

    <div class="card">
      <div class="kpi">
        <div>Estado: <span class="badge" id="panelStatus">—</span></div>
        <div>Clicks: <span class="badge" id="clickCount">0</span></div>
      </div>

      <div id="summaryArea"></div>
      <div id="clicksArea"></div>
    </div>
  </div>

  <script src="/actions.js"></script>
</body>
</html>
